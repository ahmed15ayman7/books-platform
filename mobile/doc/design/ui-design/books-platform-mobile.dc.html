<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = Object.assign({ screen: 'splash' }, window.BP.initialState);

  keys = ['splash', 'language', 'onboarding', 'home', 'catalog', 'articles', 'media', 'publishers', 'wishlist',
    'bookDetail', 'articleDetail', 'publisherDetail', 'categoryBooks', 'translatedBooks', 'recommendedBooks',
    'search', 'cart', 'publish', 'more', 'notifications', 'about', 'services', 'team', 'contact', 'privacy', 'terms'];

  go = (screen, extra = {}) =>
    this.setState({ ...window.BP.resetState, prev: this.state.screen, screen, variant: 'default', scroll: 0, sheet: null, ...extra });

  screenIs = (key) => this.state.screen === key;

  render() {
    const pick = (key) => window.BP.views[key](this, key);
    if (this.screenIs('splash')) return pick('splash');
    if (this.screenIs('language')) return pick('language');
    if (this.screenIs('onboarding')) return pick('onboarding');
    if (this.screenIs('home')) return pick('home');
    if (this.screenIs('catalog')) return pick('catalog');
    if (this.screenIs('articles')) return pick('articles');
    if (this.screenIs('media')) return pick('media');
    if (this.screenIs('publishers')) return pick('publishers');
    if (this.screenIs('wishlist')) return pick('wishlist');
    if (this.screenIs('bookDetail')) return pick('bookDetail');
    if (this.screenIs('articleDetail')) return pick('articleDetail');
    if (this.screenIs('publisherDetail')) return pick('publisherDetail');
    if (this.screenIs('categoryBooks')) return pick('categoryBooks');
    if (this.screenIs('translatedBooks')) return pick('translatedBooks');
    if (this.screenIs('recommendedBooks')) return pick('recommendedBooks');
    if (this.screenIs('search')) return pick('search');
    if (this.screenIs('cart')) return pick('cart');
    if (this.screenIs('publish')) return pick('publish');
    if (this.screenIs('more')) return pick('more');
    if (this.screenIs('notifications')) return pick('notifications');
    if (this.screenIs('about')) return pick('about');
    if (this.screenIs('services')) return pick('services');
    if (this.screenIs('team')) return pick('team');
    if (this.screenIs('contact')) return pick('contact');
    if (this.screenIs('privacy')) return pick('privacy');
    if (this.screenIs('terms')) return pick('terms');
    return window.BP.notFound(this);
  }
}
</script>
<script src="support.js"></script>
